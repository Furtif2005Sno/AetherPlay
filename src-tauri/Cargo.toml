[package]
name = "aetherplay"
version = "0.4.7"
description = "Client desktop pour RomM"
authors = ["Anthares74"]
edition = "2024"

[lib]
name = "aetherplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "net", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "cookies", "http2", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
regex = "1.13.2"
sevenz-rust2 = "0.27.0"
base64 = "0.23.1"
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }
libloading = "0.8"
tokio-tungstenite = "0.27"
mdns-sd = "0.13"
gethostname = "1"
getrandom = "0.3"
if-addrs = "0.13"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
hidapi = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(windows)'.dependencies]
jpeg-encoder = "0.6"
vigem-client = "0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_Networking_WinSock", "Win32_Devices_Bluetooth"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
