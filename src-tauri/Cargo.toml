[package]
name = "aetherplay"
version = "0.1.6"
description = "Client desktop pour RomM"
authors = ["Anthares74"]
edition = "2024"

[lib]
name = "aetherplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "cookies"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
regex = "1.13.2"
sevenz-rust2 = "0.27.0"
base64 = "0.23.1"
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }
libloading = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
