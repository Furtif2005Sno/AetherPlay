name: Build

# Push to main: installers as workflow artifacts.
# Tag v*: same, then a published GitHub release holding only the .msi and .dmg.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: msi
            installer: src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest # Apple Silicon (arm64)
            name: macos-arm64
            bundles: dmg
            installer: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # RomM's frontend requires Node 24 / npm 11 (engine-strict).
          node-version-file: romm-ui/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            romm-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm ci
        working-directory: romm-ui

      # The Rust crate embeds the built frontends, so build them before testing.
      - run: npm run build

      - run: npm run build
        working-directory: romm-ui

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: aetherplay-${{ matrix.name }}
          if-no-files-found: error
          path: ${{ matrix.installer }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Recreated from scratch so a re-run never leaves stale files behind.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Fixed names keep the .../releases/latest/download/<name> links stable
        # across versions, so a direct download link never has to change.
        run: |
          mv installers/*.msi installers/AetherPlay-Windows.msi
          mv installers/*.dmg installers/AetherPlay-Mac.dmg
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" installers/AetherPlay-Windows.msi installers/AetherPlay-Mac.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AetherPlay $TAG" \
            --notes "**Windows** : télécharger AetherPlay-Windows.msi puis double-cliquer dessus. **Mac** (Apple Silicon) : télécharger AetherPlay-Mac.dmg, glisser AetherPlay dans Applications ; au premier lancement, Réglages Système > Confidentialité et sécurité > Ouvrir quand même."
