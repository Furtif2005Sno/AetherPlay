name: Build

# Push to main: installers as workflow artifacts.
# Tag v*: same, then a published GitHub release with the .msi, .dmg, .AppImage
# and .apk, plus latest.json and the Mac update package for automatic updates.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: msi
            installer: src-tauri/target/release/bundle/msi/*.msi
            # Signature of the installer, for AetherPlay's automatic updates.
            updater: src-tauri/target/release/bundle/msi/*.msi.sig
          - os: macos-latest # Apple Silicon (arm64)
            name: macos-arm64
            bundles: app
            installer: AetherPlay.dmg
            updater: AetherPlay.app.tar.gz*
          - os: ubuntu-22.04 # SteamOS / Linux x86_64 (old glibc = runs everywhere)
            name: linux-x64
            bundles: appimage
            installer: src-tauri/target/release/bundle/appimage/*.AppImage
            updater: src-tauri/target/release/bundle/appimage/*.AppImage.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # RomM's frontend requires Node 24 / npm 11 (engine-strict).
          node-version-file: romm-ui/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            romm-ui/package-lock.json

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm ci
        working-directory: romm-ui

      # The Rust crate embeds the built frontends, so build them before testing.
      - run: npm run build

      - run: npm run build
        working-directory: romm-ui

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # With the updater key (repository secrets), also sign the installers
      # for AetherPlay's automatic updates.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run tauri build -- --bundles ${{ matrix.bundles }}
          fi

      # Gatekeeper reports an app without a bundle signature as "damaged", with
      # no way to open it. Ad-hoc sign the whole bundle (free, no Apple account),
      # check the seal, then build the .dmg from the signed app.
      - if: runner.os == 'macOS'
        run: |
          APP="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -n 1)"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"
          mkdir dmg-stage
          cp -R "$APP" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname AetherPlay -srcfolder dmg-stage -ov -format UDZO AetherPlay.dmg

      # Update package built from the signed app (the one Tauri makes comes
      # before codesign), then signed with the updater key.
      - if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            tar -czf AetherPlay.app.tar.gz -C src-tauri/target/release/bundle/macos AetherPlay.app
            npx tauri signer sign AetherPlay.app.tar.gz
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aetherplay-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.installer }}
            ${{ matrix.updater }}

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # A stable signing key lets new versions install over old ones; without
      # the secrets the APK is signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aetherplay.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/aetherplay.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: aetherplay-android
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*.apk

  # iPhone controller: unsigned .ipa, signed on the phone by SideStore / AltStore.
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -project AetherPlay.xcodeproj -scheme AetherPlay -sdk iphoneos -configuration Release             -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build             > xcodebuild.log 2>&1 || {
              # Compiler errors as annotations, readable without the full log.
              grep -E "error:|error -" xcodebuild.log | sort -u | head -40 | sed 's/^/::error::/'
              tail -30 xcodebuild.log
              exit 1
            }
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AetherPlay.app Payload/
          zip -qry AetherPlay-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: aetherplay-ios
          if-no-files-found: error
          path: ios/AetherPlay-iOS.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Recreated from scratch so a re-run never leaves stale files behind.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Fixed names keep the .../releases/latest/download/<name> links stable
        # across versions, so a direct download link never has to change.
        run: |
          # latest.json: what AetherPlay checks for automatic updates.
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          EXTRA=""
          if ls installers/*.msi.sig installers/*.AppImage.sig installers/AetherPlay.app.tar.gz.sig >/dev/null 2>&1; then
            jq -n \
              --arg version "${TAG#v}" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg win "$(cat installers/*.msi.sig)" \
              --arg mac "$(cat installers/AetherPlay.app.tar.gz.sig)" \
              --arg linux "$(cat installers/*.AppImage.sig)" \
              --arg base "$BASE" \
              '{version: $version, pub_date: $date, notes: "AetherPlay \($version)", platforms: {
                 "windows-x86_64": {signature: $win, url: "\($base)/AetherPlay-Windows.msi"},
                 "darwin-aarch64": {signature: $mac, url: "\($base)/AetherPlay-Mac.app.tar.gz"},
                 "linux-x86_64": {signature: $linux, url: "\($base)/AetherPlay-SteamOS.AppImage"}}}' \
              > installers/latest.json
            mv installers/AetherPlay.app.tar.gz installers/AetherPlay-Mac.app.tar.gz
            EXTRA="installers/latest.json installers/AetherPlay-Mac.app.tar.gz"
          fi
          rm -f installers/*.sig
          mv installers/*.msi installers/AetherPlay-Windows.msi
          mv installers/*.dmg installers/AetherPlay-Mac.dmg
          mv installers/*.AppImage installers/AetherPlay-SteamOS.AppImage
          mv installers/*.apk installers/AetherPlay-Android.apk
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" installers/AetherPlay-Windows.msi installers/AetherPlay-Mac.dmg installers/AetherPlay-SteamOS.AppImage installers/AetherPlay-Android.apk installers/AetherPlay-iOS.ipa $EXTRA \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AetherPlay $TAG" \
            --notes "**Windows** : télécharger AetherPlay-Windows.msi puis double-cliquer dessus. **Mac** (Apple Silicon) : télécharger AetherPlay-Mac.dmg, glisser AetherPlay dans Applications ; au premier lancement, Réglages Système > Confidentialité et sécurité > Ouvrir quand même. **SteamOS / Linux** : en mode Bureau, télécharger AetherPlay-SteamOS.AppImage, clic droit > Propriétés > Permissions > Exécutable, puis l'ajouter à Steam (Ajouter un jeu non-Steam) pour le lancer en mode Jeu. **Android** (manette) : ouvrir AetherPlay-Android.apk sur le téléphone et autoriser l'installation. **iPhone** (manette, Wi-Fi) : installer SideStore, puis ouvrir AetherPlay-iOS.ipa avec SideStore (à renouveler tous les 7 jours depuis SideStore)."
