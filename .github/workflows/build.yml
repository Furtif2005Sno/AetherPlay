name: Build

# Push to main: installers as workflow artifacts.
# Tag v*: same, then a published GitHub release holding only the .msi, .dmg, .AppImage and .apk.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: msi
            installer: src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest # Apple Silicon (arm64)
            name: macos-arm64
            bundles: app
            installer: AetherPlay.dmg
          - os: ubuntu-22.04 # SteamOS / Linux x86_64 (old glibc = runs everywhere)
            name: linux-x64
            bundles: appimage
            installer: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # RomM's frontend requires Node 24 / npm 11 (engine-strict).
          node-version-file: romm-ui/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            romm-ui/package-lock.json

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm ci
        working-directory: romm-ui

      # The Rust crate embeds the built frontends, so build them before testing.
      - run: npm run build

      - run: npm run build
        working-directory: romm-ui

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # Gatekeeper reports an app without a bundle signature as "damaged", with
      # no way to open it. Ad-hoc sign the whole bundle (free, no Apple account),
      # check the seal, then build the .dmg from the signed app.
      - if: runner.os == 'macOS'
        run: |
          APP="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -n 1)"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"
          mkdir dmg-stage
          cp -R "$APP" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname AetherPlay -srcfolder dmg-stage -ov -format UDZO AetherPlay.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: aetherplay-${{ matrix.name }}
          if-no-files-found: error
          path: ${{ matrix.installer }}

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # A stable signing key lets new versions install over old ones; without
      # the secrets the APK is signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aetherplay.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/aetherplay.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: aetherplay-android
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Recreated from scratch so a re-run never leaves stale files behind.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Fixed names keep the .../releases/latest/download/<name> links stable
        # across versions, so a direct download link never has to change.
        run: |
          mv installers/*.msi installers/AetherPlay-Windows.msi
          mv installers/*.dmg installers/AetherPlay-Mac.dmg
          mv installers/*.AppImage installers/AetherPlay-SteamOS.AppImage
          mv installers/*.apk installers/AetherPlay-Android.apk
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" installers/AetherPlay-Windows.msi installers/AetherPlay-Mac.dmg installers/AetherPlay-SteamOS.AppImage installers/AetherPlay-Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AetherPlay $TAG" \
            --notes "**Windows** : télécharger AetherPlay-Windows.msi puis double-cliquer dessus. **Mac** (Apple Silicon) : télécharger AetherPlay-Mac.dmg, glisser AetherPlay dans Applications ; au premier lancement, Réglages Système > Confidentialité et sécurité > Ouvrir quand même. **SteamOS / Linux** : en mode Bureau, télécharger AetherPlay-SteamOS.AppImage, clic droit > Propriétés > Permissions > Exécutable, puis l'ajouter à Steam (Ajouter un jeu non-Steam) pour le lancer en mode Jeu. **Android** (manette) : ouvrir AetherPlay-Android.apk sur le téléphone et autoriser l'installation."
