# iOS controller app (SwiftUI). The Xcode project is generated from this
# file by XcodeGen (CI: `xcodegen` in this folder), then built unsigned and
# packed as AetherPlay-iOS.ipa, which SideStore / AltStore sign on install.
name: AetherPlay
options:
  bundleIdPrefix: fr.jolannrt
  deploymentTarget:
    iOS: "16.0"
targets:
  AetherPlay:
    type: application
    platform: iOS
    sources:
      - AetherPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jolannrt.aetherplay
        PRODUCT_NAME: AetherPlay
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "15"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: AetherPlay/Info.plist
      properties:
        CFBundleDisplayName: AetherPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Finding AetherPlay on the local network (Bonjour) and talking to it.
        NSLocalNetworkUsageDescription: AetherPlay cherche l'ordinateur qui fait tourner AetherPlay sur ton réseau pour servir de manette.
        NSBonjourServices:
          - _aetherplay._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
